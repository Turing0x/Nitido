name: Nitido
options:
  bundleIdPrefix: com.threedotsdev
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: es
  knownRegions: [es, en, Base]

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    GCC_WARN_INHIBIT_ALL_WARNINGS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Nitido:
    type: application
    platform: iOS
    sources:
      - path: Nitido
        excludes:
          # Configuración local de compras: la usa el esquema, no la app.
          # Sin esta exclusión acabaría copiada dentro del bundle, porque
          # cualquier fichero que no sea Swift bajo `Nitido/` se trata como
          # recurso.
          - "Resources/Nitido.storekit"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.threedotsdev.nitido
        PRODUCT_NAME: Nitido
        INFOPLIST_FILE: Nitido/Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO

  NitidoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NitidoTests
    dependencies:
      - target: Nitido
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.threedotsdev.nitido.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nitido:
    build:
      targets:
        Nitido: all
    test:
      targets:
        - NitidoTests
    run:
      config: Debug
      # Permite comprar en el simulador y en dispositivo sin subir nada a
      # App Store Connect.
      storeKitConfiguration: Nitido/Resources/Nitido.storekit
